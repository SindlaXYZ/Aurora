services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

        # controllers are imported separately to make sure services can be injected
        # as action arguments even if you don't extend any base controller class
        #Aurora\Controller\:
        #resource: 'src/Controller/'
        #tags: ['controller.service_arguments']

    #    AuroraBundleControllers:
    #        resource: Sindla\Bundle\AuroraBundle\Controller
    #        type:     annotation

    #    aurora.controller.pwa:
    #        class: Sindla\Bundle\AuroraBundle\Controller\PWAController
    #        autowire: true
    #        autoconfigure: true
    #        public: true

    ###################################################################################################################
    ###  Aurora Doctrine Event Subscribers  ###########################################################################

    Sindla\Bundle\AuroraBundle\EventSubscriber\SoftDeleteIndexSubscriber:
        tags:
            - { name: doctrine.event_listener, event: loadClassMetadata }

    # Runs the #[ORM\PrePersist] / #[ORM\PreUpdate] callbacks of the Aurora entity traits (e.g. TimestampableCreated)
    Sindla\Bundle\AuroraBundle\EventSubscriber\TraitLifecycleCallbacksSubscriber:
        tags:
            - { name: doctrine.event_listener, event: loadClassMetadata }

    ###################################################################################################################
    ###  Aurora Controller ############################################################################################

    aurora.controller.test:
        class: 'Sindla\Bundle\AuroraBundle\Controller\TestController'
        tags: ['controller.service_arguments']
        calls:
            - [setContainer, ["@service_container"]]

    aurora.controller.blackhole:
        class: 'Sindla\Bundle\AuroraBundle\Controller\BlackHoleController'
        tags: ['controller.service_arguments']
        calls:
            - [setContainer, ["@service_container"]]

    aurora.controller.pwa:
        class: 'Sindla\Bundle\AuroraBundle\Controller\PWAController'
        tags: ['controller.service_arguments']
        calls:
            - [setContainer, ["@service_container"]]

    aurora.controller.compiled:
        class: 'Sindla\Bundle\AuroraBundle\Controller\CompiledController'
        tags: ['controller.service_arguments']
        calls:
            - [setContainer, ["@service_container"]]

    # Extra controller. See `src/Resources/config/routes/routes.yaml : aurora_extra` &
    Sindla\Bundle\AuroraBundle\DependencyInjection\ExtraLoader:
        tags: [routing.loader]

    ###################################################################################################################
    ###  Aurora Commands  #############################################################################################

    aurora.command.cloudflare.r2:
        class: Sindla\Bundle\AuroraBundle\Command\CloudflareR2Command
        arguments: ['@aurora.cloudflare.r2']
        tags:
            - { name: console.command }

    # Register TestCommand (see the class file for the command name)
    aurora.command.test:
        class: Sindla\Bundle\AuroraBundle\Command\TestCommand
        tags:
            - { name: console.command }

#    # Register TestCommand (see the class file for the command name)
#    aurora.command.i18n:
#        class: Sindla\Bundle\AuroraBundle\Command\I18nCommand
#        tags:
#            - { name: console.command }

    # Register LazyEntity command (see the class file for the command name)
    aurora.command.lazy_entity:
        class: Sindla\Bundle\AuroraBundle\Command\LazyEntityCommand
        arguments: ['@service_container']
        tags:
            - { name: console.command }

    # Register PHPUnit command (see the class file for the command name)
    aurora.command.php_unit:
        class: Sindla\Bundle\AuroraBundle\Command\PHPUnitCommand
        arguments: ['@parameter_bag']
        tags:
            - { name: console.command }

    # Register the ComposerUpdate command (see the class file for the command name)
    aurora.command.composer:
        class: Sindla\Bundle\AuroraBundle\Command\ComposerCommand
        arguments: ['@service_container']
        tags:
            - { name: console.command }

    ###################################################################################################################
    ###  Aurora Console  ##############################################################################################

    Sindla\Bundle\AuroraBundle\Console\SymfonyStyleFactory: ~

    Symfony\Component\Console\Style\SymfonyStyle:
        factory: ['@Sindla\Bundle\AuroraBundle\Console\SymfonyStyleFactory', 'create']

    ###################################################################################################################
    ###  Aurora Twig  #################################################################################################

    # Used by the README Twig global (aurora: '@aurora.twig.utility') and by the OutputSubscriber
    aurora.twig.utility:
        class: Sindla\Bundle\AuroraBundle\Utils\AuroraTwig\UtilityExtension
        arguments: ['@service_container', '@request_stack', '@twig', '@aurora.helper']
        tags:
            - { name: twig.extension }
        public: true

    ###################################################################################################################
    ###  Aurora Services / Utils  #####################################################################################
    # Public: they are fetched from the container by id (PWAController, ComposerCommand, UtilityExtension, host apps)

    aurora.array:
        class: Sindla\Bundle\AuroraBundle\Utils\AuroraArray\AuroraArray
        public: true

    aurora.calendar:
        class: Sindla\Bundle\AuroraBundle\Utils\AuroraCalendar\AuroraCalendar
        public: true

    aurora.chronos:
        class: Sindla\Bundle\AuroraBundle\Utils\AuroraChronos\AuroraChronos
        public: true

    aurora.client:
        class: Sindla\Bundle\AuroraBundle\Utils\AuroraClient\AuroraClient
        arguments: ['@service_container']
        public: true

    aurora.cookies.extractor:
        class: Sindla\Bundle\AuroraBundle\Utils\AuroraCookiesExtractor\AuroraCookiesExtractor
        public: true

    aurora.ip:
        class: Sindla\Bundle\AuroraBundle\Utils\AuroraIP\AuroraIP
        public: true

    aurora.match:
        class: Sindla\Bundle\AuroraBundle\Utils\AuroraMatch\AuroraMatch
        public: true

    aurora.calculus:
        class: Sindla\Bundle\AuroraBundle\Utils\AuroraCalculus\AuroraCalculus
        public: true

    aurora.diacritics:
        class: Sindla\Bundle\AuroraBundle\Utils\AuroraDiacritics\AuroraDiacritics
        public: true

    aurora.git:
        class: Sindla\Bundle\AuroraBundle\Utils\AuroraGit\AuroraGit
        # ParameterBagInterface is autowired.
        public: true

    aurora.helper:
        class: Sindla\Bundle\AuroraBundle\Utils\AuroraHelper\AuroraHelper
        public: true

    aurora.io:
        class: Sindla\Bundle\AuroraBundle\Utils\AuroraIO\AuroraIO
        public: true

    aurora.pwa:
        class: Sindla\Bundle\AuroraBundle\Utils\AuroraPWA\AuroraPWA
        # ParameterBagInterface, Twig and the "aurora.git" service (via #[Autowire]) are autowired.
        public: true

    aurora.sanitizer:
        class: Sindla\Bundle\AuroraBundle\Utils\AuroraSanitizer\AuroraSanitizer
        public: true

    aurora.strink:
        class: Sindla\Bundle\AuroraBundle\Utils\AuroraStrink\AuroraStrink
        shared: false # stateful fluent builder: a new instance every time
        public: true

    aurora.cloudflare.r2:
        class: Sindla\Bundle\AuroraBundle\Utils\AuroraCloudflareR2\AuroraCloudflareR2
        public: true

    ###################################################################################################################
    ###################################################################################################################
