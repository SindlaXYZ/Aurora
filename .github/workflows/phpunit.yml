name: PHPUnit

on:
    pull_request:
    push:
        branches:
            - "8.0"
env:
    fail-fast: true
    WORKSPACE: "${{ github.workspace }}"
    BUILD_DIR: "${{ github.workspace }}/build"
    # PHP
    PHP_INI_VALUES: assert.exception=1, memory_limit=-1, zend.assertions=1, log_errors_max_len=0
    # PHPUnit
    PHPUNIT: "${{ github.workspace }}/build/bin/phpunit"
    PHPUNIT_FLAGS_WITHOUT_COVERAGE: "--no-coverage"
    PHPUNIT_FLAGS_WITH_COVERAGE: "--coverage-clover ${{ github.workspace }}/build/.github/.test-results/clover.xml --log-junit ${{ github.workspace }}/build/.github/.test-results/junit.xml"
    # Symfony
    SYMFONY_VERSION: "8.0.x-dev" # 8.0.* / 8.0.x-dev
    SYMFONY_PHPUNIT_DIR: "$HOME/symfony-bridge/.phpunit"
    SYMFONY_DEPRECATIONS_HELPER: 0
    # Aurora
    AURORA_VERSION: "8.0"

permissions:
    contents: write

jobs:
    build:
        name: "${{ matrix.operating-system }} / PHP ${{ matrix.php-version }}"
        runs-on: ${{ matrix.operating-system }}
        continue-on-error: false

        strategy:
            matrix:
                operating-system: [ 'ubuntu-22.04' ]
                php-version: [ '8.4' ]
        # IT WORKS, BUT IT'S NOT NEEDED
        #        services:
        #            postgres:
        #                image: postgres:16
        #                env:
        #                    POSTGRES_USER: POSTGRESQL_USERNAME
        #                    POSTGRES_PASSWORD: POSTGRESQL_PASSWORD
        #                    POSTGRES_DB: POSTGRESQL_DATABASE_test
        #                ports:
        #                    - 5432:5432
        #                options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
        steps:
            -   name: "Checkout code"
                uses: actions/checkout@v4

            -   name: "Install PHP with extensions"
                uses: shivammathur/setup-php@v2
                with:
                    coverage: "xdebug"
                    extensions: "intl, mbstring, pdo_pgsql, zip, xdebug"
                    ini-values: ${{ env.PHP_INI_VALUES }}
                    php-version: ${{ matrix.php-version }}
                    tools: composer:v2

            -   name: "Add PHPUnit matcher"
                run: echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

            -   name: "Set composer cache directory"
                id: composer-cache
                run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
                shell: bash

            -   name: "Cache composer"
                uses: actions/cache@v4
                with:
                    path: ${{ steps.composer-cache.outputs.dir }}
                    key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
                    restore-keys: ${{ runner.os }}-composer-

            -   name: "Install dependencies"
                run: |
                    mkdir -p ${{ env.BUILD_DIR }}

            -   name: "Create a Symfony skeleton project and install dependencies, including sindla/aurora (dev version)"
                working-directory: ${{ env.BUILD_DIR }}
                run: |
                    echo -e "\033[0;35m * current working directory: \033[0m"
                    echo "$PWD"

                    echo -e "\033[0;35m * composer create-project symfony/skeleton \033[0m"
                    composer create-project symfony/skeleton:${{ env.SYMFONY_VERSION }} . --no-cache

                    # echo -e "\033[0;35m * composer install from sindla/aurora \033[0m"
                    # cp -f ${{ env.WORKSPACE }}/composer.json ${{ env.BUILD_DIR }}/composer.json
                    # composer install --ansi --no-interaction --no-progress

                    echo -e "\033[0;35m * require symfony/webapp-pack \033[0m"
                    composer require symfony/webapp-pack

                    echo -e "\033[0;35m * composer require sindla/aurora \033[0m"
                    composer require sindla/aurora:${{ env.AURORA_VERSION }}.x-dev -W --no-cache --no-progress
                    composer require brick/math:^0.14 -W --no-cache --no-progress

                    echo -e "\033[0;35m * composer require phpunit/phpunit \033[0m"
                    composer require phpunit/phpunit:^12.4 -W --dev --no-progress

                    echo -e "\033[0;35m * composer require dama/doctrine-test-bundle \033[0m"
                    composer require dama/doctrine-test-bundle:^8.4 -W --dev --no-progress

                    echo -e "\033[0;35m * sync files \033[0m"
                    cp -rf "${{ env.WORKSPACE }}/src/"* "${{ env.BUILD_DIR }}/vendor/sindla/aurora/src"
                    cp -rf "${{ env.WORKSPACE }}/tests/"* "${{ env.BUILD_DIR }}/vendor/sindla/aurora/tests"
                    cp -f ${{ env.WORKSPACE }}/src/Resources/schema/packages/aurora.yaml ${{ env.BUILD_DIR }}/config/packages/aurora.yaml
                    cat ${{ env.WORKSPACE }}/src/Resources/schema/routes.append.yaml >> ${{ env.BUILD_DIR }}/config/routes.yaml
                    cp -f ${{ env.WORKSPACE }}/tests/bootstrap.php ${{ env.BUILD_DIR }}/tests/bootstrap.php
                    cp -f ${{ env.WORKSPACE }}/phpunit.xml.dist ${{ env.BUILD_DIR }}/phpunit.xml.dist
                    cp -f ${{ env.BUILD_DIR }}/vendor/sindla/aurora/phpunit.xml.dist ${{ env.BUILD_DIR }}/phpunit.xml.dist

            #            -   name: "Prepare database"
            #                run: |
            #                    sudo /usr/bin/php ${{ env.WORKSPACE }}/bin/console doctrine:database:create --env=test --if-not-exists
            #                    sudo /usr/bin/php ${{ env.WORKSPACE }}/bin/console doctrine:schema:update --force --env=test

            -   name: "Composer clear & autoloader dump"
                run: |
                    echo -e "\033[0;35m * current working directory: \033[0m"
                    echo "$PWD"

                    composer clear-cache
                    composer dump-autoload

            -   name: "Prepare report directories"
                working-directory: ${{ env.BUILD_DIR }}
                run: |
                    mkdir -p build/logs
                    mkdir -p .envs/.test-results

            -   name: "Check versions"
                working-directory: ${{ env.BUILD_DIR }}
                run: |
                    echo -e "\033[0;35m * current working directory: \033[0m"
                    echo "$PWD"

                    echo -e "\033[0;35m * OS Name: \033[0m"
                    . /etc/os-release && echo $PRETTY_NAME

                    echo -e "\033[0;35m * PHP Version: \033[0m"
                    php --version
                    php -r "phpinfo();" | grep opcache.save_comments

                    echo -e "\033[0;35m * Composer Version: \033[0m"
                    composer -V

                    echo -e "\033[0;35m * bin/phpunit Version: \033[0m"
                    bin/phpunit --version

                    echo -e "\033[0;35m * vendor/bin/phpunit Version: \033[0m"
                    vendor/bin/phpunit --version

                    echo -e "\033[0;35m * ${{ env.BUILD_DIR }}/vendor/bin/phpunit Version: \033[0m"
                    ${{ env.BUILD_DIR }}/vendor/bin/phpunit --version

                    # sed -i -e 's/    orm:/    orm:\n        controller_resolver:\n            auto_mapping: true/g' ${{ env.BUILD_DIR }}/config/packages/doctrine.yaml
                    # cat ${{ env.BUILD_DIR }}/config/packages/doctrine.yaml

            -   name: "Test /Command/ directory"
                run: |
                    /usr/bin/php ${{ env.BUILD_DIR }}/vendor/bin/phpunit ${{ env.PHPUNIT_FLAGS_WITHOUT_COVERAGE }} \
                    -c ${{ env.BUILD_DIR }}/phpunit.xml.dist \
                    ${{ env.BUILD_DIR }}/vendor/sindla/aurora/tests/Command/

            -   name: "Test /Console/ directory"
                run: |
                    /usr/bin/php ${{ env.BUILD_DIR }}/vendor/bin/phpunit ${{ env.PHPUNIT_FLAGS_WITHOUT_COVERAGE }} \
                    -c ${{ env.BUILD_DIR }}/phpunit.xml.dist \
                    ${{ env.BUILD_DIR }}/vendor/sindla/aurora/tests/Console/

            -   name: "Test /Controller/ directory"
                run: |
                    /usr/bin/php ${{ env.BUILD_DIR }}/vendor/bin/phpunit ${{ env.PHPUNIT_FLAGS_WITHOUT_COVERAGE }} \
                    -c ${{ env.BUILD_DIR }}/phpunit.xml.dist \
                    ${{ env.BUILD_DIR }}/vendor/sindla/aurora/tests/Controller/

            -   name: "Test /Entity/ directory"
                run: |
                    /usr/bin/php ${{ env.BUILD_DIR }}/vendor/bin/phpunit ${{ env.PHPUNIT_FLAGS_WITHOUT_COVERAGE }} \
                    -c ${{ env.BUILD_DIR }}/phpunit.xml.dist \
                    ${{ env.BUILD_DIR }}/vendor/sindla/aurora/tests/Entity/

            -   name: "Test /EventListener/ directory"
                run: |
                    /usr/bin/php ${{ env.BUILD_DIR }}/vendor/bin/phpunit ${{ env.PHPUNIT_FLAGS_WITHOUT_COVERAGE }} \
                    -c ${{ env.BUILD_DIR }}/phpunit.xml.dist \
                    ${{ env.BUILD_DIR }}/vendor/sindla/aurora/tests/EventListener/

            -   name: "Test /Utils/ directory"
                run: |
                    /usr/bin/php ${{ env.BUILD_DIR }}/vendor/bin/phpunit ${{ env.PHPUNIT_FLAGS_WITHOUT_COVERAGE }} \
                    -c ${{ env.BUILD_DIR }}/phpunit.xml.dist \
                    ${{ env.BUILD_DIR }}/vendor/sindla/aurora/tests/Utils/

            -   name: "Test RequirementsTest"
                run: |
                    /usr/bin/php ${{ env.BUILD_DIR }}/vendor/bin/phpunit ${{ env.PHPUNIT_FLAGS_WITHOUT_COVERAGE }} \
                    -c ${{ env.BUILD_DIR }}/phpunit.xml.dist \
                    ${{ env.BUILD_DIR }}/vendor/sindla/aurora/tests/RequirementsTest.php

            -   name: "Run all test with coverage"
                run: |
                    /usr/bin/php ${{ env.BUILD_DIR }}/vendor/bin/phpunit ${{ env.PHPUNIT_FLAGS_WITH_COVERAGE }} \
                    -c ${{ env.BUILD_DIR }}/phpunit.xml.dist \
                    ${{ env.BUILD_DIR }}/vendor/sindla/aurora/tests/

            #########################################################################################################################################
            ###   Generate and commit PHPUnit badges   ##############################################################################################

            -   name: "Check if branch matches version pattern"
                id: check_branch
                run: |
                    BRANCH_NAME="${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"
                    echo "Branch name: $BRANCH_NAME"

                    # Pattern for X.Y where X >= 7 and Y >= 0
                    if [[ $BRANCH_NAME =~ ^([7-9]|[1-9][0-9]+)\.([0-9]+)$ ]]; then
                        MAJOR_VERSION=${BASH_REMATCH[1]}
                        MINOR_VERSION=${BASH_REMATCH[2]}

                        if [ $MAJOR_VERSION -ge 7 ]; then
                            echo "should_commit=true" >> $GITHUB_OUTPUT
                            echo "Branch $BRANCH_NAME matches version pattern (Major: $MAJOR_VERSION, Minor: $MINOR_VERSION)"
                        else
                            echo "should_commit=false" >> $GITHUB_OUTPUT
                            echo "Branch $BRANCH_NAME has major version < 7"
                        fi
                    else
                        echo "should_commit=false" >> $GITHUB_OUTPUT
                        echo "Branch $BRANCH_NAME does not match version pattern X.Y"
                    fi

            -   name: "Generate PHPUnit badges"
                if: steps.check_branch.outputs.should_commit == 'true'
                working-directory: ${{ env.BUILD_DIR }}
                run: |
                    mkdir -p ../.github/badges

                    /usr/bin/php bin/console aurora:php-unit \
                    --action=generatePHPUnitPassingBadge \
                    --junitXMLFilePath=${{ env.BUILD_DIR }}/.github/.test-results/junit.xml \
                    --outputPassingSVGFilePath=../.github/badges/phpunit.svg

                    /usr/bin/php bin/console aurora:php-unit \
                    --action=generatePHPUnitCodeCoverageBadge \
                    --cloverXMLFilePath=${{ env.BUILD_DIR }}/.github/.test-results/clover.xml \
                    --outputCoverageSVGFilePath=../.github/badges/coverage.svg \
                    --outputStatementsSVGFilePath=../.github/badges/statements.svg

                    curl -L \
                    "https://github.com/SindlaXYZ/Aurora/actions/workflows/phpunit.yml/badge.svg" \
                    -o ../.github/badges/phpunit-tests.svg

            -   name: "Commit PHPUnit badges"
                if: steps.check_branch.outputs.should_commit == 'true'
                run: |
                    BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"
                    git config user.name "github-actions[bot]"
                    git config user.email "github-actions[bot]@users.noreply.github.com"
                    git config --global pull.rebase true
                    git config --global rebase.autoStash true
                    git pull origin "HEAD:${BRANCH}"
                    git add .github/badges/coverage.svg .github/badges/phpunit.svg .github/badges/phpunit-tests.svg .github/badges/statements.svg
                    git commit -m "Update PHPUnit badges" || echo "No changes to commit"
                    git push origin "HEAD:${BRANCH}"

            #########################################################################################################################################
            ###   Auto-merge codex Pull Requests   ##################################################################################################

            -   name: "Check if branch is codex branch"
                id: check_codex_branch
                run: |
                    BRANCH_NAME="${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"
                    echo "Branch name: $BRANCH_NAME"

                    if [[ $BRANCH_NAME =~ ^codex/ ]]; then
                        echo "is_codex_branch=true" >> $GITHUB_OUTPUT
                        echo "Branch $BRANCH_NAME is a codex branch - auto-merge will be attempted"
                    else
                        echo "is_codex_branch=false" >> $GITHUB_OUTPUT
                        echo "Branch $BRANCH_NAME is not a codex branch"
                    fi

            -   name: "Auto-merge codex Pull Request"
                if: steps.check_codex_branch.outputs.is_codex_branch == 'true' && github.event_name == 'pull_request'
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                run: |
                    PR_NUMBER=${{ github.event.number }}
                    echo "Attempting to merge PR #${PR_NUMBER} for codex branch"

                    # Enable auto-merge for the PR
                    gh pr merge ${PR_NUMBER} --auto --squash --delete-branch

                    echo "Auto-merge enabled for PR #${PR_NUMBER}. It will be merged automatically when all checks pass."
